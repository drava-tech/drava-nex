  # ───────────────────────── cms ─────────────────────────
  - id: cms_what_is
    topic: cms
    question_type: [what]
    variants:
      - What is the CMS
      - Tell me about CMS
      - What is this CMS only
      - What does the CMS do
      - Explain the CMS
      - What is this platform
      - Which company made the CMS
      - What is the control system
    answer: The CMS is the control system for this experience centre, built by White Tusker. From one web page, an operator controls what plays on every screen, runs interactive experiences, and operates the room itself.
    sources:
      - "cms_platform.md: What the CMS is"
    next_sections: ["Screens", "Experiences", "Controlling the room"]
    add_email_line: false
    status: approved

  - id: cms_screens
    topic: cms
    question_type: [how, what]
    variants:
      - How are the screens managed in the CMS
      - Can screens be managed one by one
      - What happens when there is a power cut
      - What happens when the network goes down
      - How does the CMS handle screens
    answer: Every screen is controlled on its own. An operator can show an experience or media item, queue videos, pause, skip, blank or reset it. If a screen loses power or network, it comes back showing what it was meant to show.
    sources:
      - "cms_platform.md: Screens"
    next_sections: ["Experiences", "Media and presentations"]
    add_email_line: false
    status: approved

  - id: cms_experiences
    topic: cms
    question_type: [what, how]
    variants:
      - What is an experience in the CMS
      - What kind of experiences are there
      - What templates do you have
      - What interactive content can you make
      - Do you have a flight simulation
      - How are experiences edited
      - Can one experience be reused
      - Tell me about experiences
    answer: An experience is interactive content built from a template, such as a welcome screen, a portfolio, a product showcase, a gallery, a flight simulation, a live stream or object recognition. Operators edit its content with a live preview.
    sources:
      - "cms_platform.md: Experiences"
    next_sections: ["Media and presentations", "Products and portfolio"]
    add_email_line: false
    status: approved

  - id: cms_media
    topic: cms
    question_type: [what, how]
    variants:
      - What is the media library
      - What kind of media can I upload
      - Can I add videos and presentations
      - Can I send media by email
      - How is uploaded media used
      - Can it handle presentations
      - Tell me about media in the CMS
      - What files does the CMS support
    answer: The media library holds videos, images and documents such as presentations. Media can be uploaded, added from a web link, or arrive as an attachment. An operator pushes an item to one or more screens, or queues several to play one after another.
    sources:
      - "cms_platform.md: Media and presentations"
    next_sections: ["Screens", "Experiences"]
    add_email_line: false
    status: approved

  - id: cms_room_controls
    topic: cms
    question_type: [what, how]
    variants:
      - Does the CMS control the room
      - Can the CMS handle air conditioning
      - Does it support brightness and colour changes
      - Can the CMS change the volume
      - Can the CMS operate the entrance
    answer: The CMS also runs the room's equipment. Operators can switch lights on and off, set brightness and colour, change the air conditioning, adjust the TV volume with its remote, and lock or unlock the door.
    sources:
      - "cms_platform.md: Controlling the room"
    next_sections: ["Room modes", "What you can say to Travis"]
    add_email_line: false
    status: approved

  - id: cms_room_modes
    topic: cms
    question_type: [what, how]
    variants:
      - What are the room modes
      - What lighting modes are there
      - What lighting is used before a visitor enters
      - What lighting is used during a meeting
      - What lighting is used during a presentation
      - Does the room have ready made lighting settings
      - How does the lighting change during a visit
      - What are the stages of a visit
    answer: The room has ready-made lighting modes for the stages of a visit, pre entry, entry, meeting and presentation. Choosing a mode sets the lights for that moment in one step, and the operator can adjust the light levels afterwards.
    sources:
      - "cms_platform.md: Room modes"
    next_sections: ["Controlling the room"]
    add_email_line: false
    status: approved

  - id: cms_products_portfolio
    topic: cms
    question_type: [where, what, how]
    variants:
      - Does the CMS store product details
      - Where is the portfolio kept
      - What is the product showcase
      - How is the portfolio organised
      - How are products presented
      - Can the portfolio be presented to visitors
      - Where are the White Tusker projects stored
    answer: The CMS keeps product details with their features, specifications and media, which feed the product showcase. It also holds the White Tusker portfolio, organised by verticals, companies and projects, which can be shown on the main screen.
    sources:
      - "cms_platform.md: Products and portfolio"
    next_sections: ["Experiences", "Whiteboards"]
    add_email_line: false
    status: approved

  - id: cms_whiteboards
    topic: cms
    question_type: [what, how]
    variants:
      - Does the CMS have whiteboards
      - Can we draw live during a meeting
      - Is there a whiteboard feature
      - Tell me about whiteboards
      - Can multiple pages be created on a whiteboard
      - Can a screen be used as a shared board
      - Can I draw and others see it
    answer: Operators can create multi page whiteboards and draw on them live. The strokes appear on the chosen screens as they are drawn, so a screen can be used like a shared board during a meeting.
    sources:
      - "cms_platform.md: Whiteboards"
    next_sections: ["Who can use it"]
    add_email_line: false
    status: approved

  - id: cms_who_can_use
    topic: cms
    question_type: [who]
    variants:
      - Who can use the CMS
      - Who are the users of the CMS
      - Do I need to sign in
      - Are there user roles
      - Is the CMS a web application
      - Does it need a login
      - Who can edit content
      - Is a login needed to view content
    answer: Operators sign in from a web browser. The CMS has users and roles, so administrators can create and edit content while others only operate the room. The screens themselves need no sign in.
    sources:
      - "cms_platform.md: Who can use it"
    next_sections: ["What the CMS is", "Whiteboards"]
    add_email_line: false
    status: approved

  # ───────────────────────── travis ─────────────────────────
  - id: travis_what_is
    topic: travis
    question_type: [who, what]
    variants:
      - Who is Travis
      - What is Travis
      - Tell me about Travis
      - What is the Travis control system
      - Who made Travis
      - Who built Travis
      - What is Travis only
      - Is Travis a voice assistant
    answer: Travis is the voice assistant built by White Tusker. It controls this space, the lights, AC, the door, and what plays on each screen.
    sources:
      - "travis.md: About Travis"
    next_sections: ["What you can say to Travis", "Controlling the room"]
    add_email_line: false
    status: approved

  - id: travis_how_to_talk
    topic: travis
    question_type: [how, what]
    variants:
      - How do I talk to Travis
      - How do I give a command to Travis
      - How do I use Travis
      - What should I say to Travis
      - How to wake Travis
      - What commands does Travis understand
      - How do I speak to you
      - What is the wake word
    answer: Say the wake word, then a request, such as set the AC to twenty two, lock the door or lower the volume. Travis can also show an experience or media item on a screen.
    sources:
      - "cms_platform.md: What you can say to Travis"
    next_sections: ["Controlling the room", "Room modes"]
    add_email_line: false
    status: approved

  - id: travis_and_cms
    topic: travis
    question_type: [how, what]
    variants:
      - Is Travis part of the CMS
      - How is Travis connected to the CMS
      - Does Travis use the CMS
      - How does Travis work with the CMS
      - Is Travis the same as the CMS
      - What is the difference between Travis and the CMS
    answer: Travis uses the same controls as the CMS, so what you ask Travis to do is what the CMS does.
    sources:
      - "cms_platform.md: Controlling the room"
    next_sections: ["What the CMS is", "What you can say to Travis"]
    add_email_line: false
    status: approved

