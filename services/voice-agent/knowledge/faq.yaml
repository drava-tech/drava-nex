  # ───────────────────────── company ─────────────────────────
  - id: company_overview
    topic: company
    question_type: [what]
    variants:
      - What is White Tusker
      - Tell me about White Tusker
      - Tell me about your company
      - What does White Tusker do
      - What does your company do
      - Can you please tell me about the company
      - Tell me about the studio
      - What kind of company is this
    answer: White Tusker is a brand experience design studio. We design, connect, create and control the complete experience, with spaces that respond to people, content, data and events.
    sources:
      - "the_white_tusker.md: Who we are"
    next_sections: ["Our three verticals", "How we work", "Clients"]
