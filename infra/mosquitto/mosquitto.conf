# ─── Mosquitto MQTT Broker — CMS Platform ────────────────────────────────────
#
# WARNING: allow_anonymous true is for LOCAL DEVELOPMENT ONLY.
# Before exposing MQTT externally or going to production:
#   1. Set allow_anonymous false
#   2. Create a password file: mosquitto_passwd -c /mosquitto/config/passwd <username>
#   3. Add: password_file /mosquitto/config/passwd
#   4. Consider TLS: cafile, certfile, keyfile directives

# ─── MQTT listener (standard protocol) ───────────────────────────────────────
listener 1883
protocol mqtt
allow_anonymous true

# ─── WebSocket listener (browser-based MQTT clients) ─────────────────────────
listener 9001
protocol websockets
allow_anonymous true

# ─── Persistence ──────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ─── Logging ──────────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
