# Local development services for push-platform.
#
# Its own compose project and its own port (5433): this machine also runs the
# cms-platform stack, whose Postgres already owns 5432. Nothing here may share a
# name, volume or port with it.
name: push-platform-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: push-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: push
      POSTGRES_PASSWORD: push
      POSTGRES_DB: push
    ports:
      - "5433:5432"
    volumes:
      - push-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U push -d push"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  push-dev-postgres:
