# CMS Platform — Full Docker Stack
# All services run in containers. Nginx is exposed on port 80; PostgreSQL (5432)
# and MQTT (1883) are also published to the host so local dev tools and LAN
# smart devices can reach them. Everything else stays on the internal network.
#
# Start:  docker compose --env-file ../../.env -f docker-compose.yml up -d
# Stop:   docker compose -f docker-compose.yml down
# Logs:   docker compose -f docker-compose.yml logs -f
# Build:  docker compose --env-file ../../.env -f docker-compose.yml build

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  # pgvector build of Postgres 16 (Debian-based) — same PG major as the previous
  # postgres:16-alpine, so the existing data volume is reused as-is. The vector
  # extension is required by the vision service's visitor table (migration 0010).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # exposed to host for drizzle-kit and local dev tools
    volumes:
      - E:/EC/cms-platform-data/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - public # must be on public so the host port binding resolves (internal: true blocks it)

  # ─── Mosquitto MQTT Broker ──────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cms-mosquitto
    restart: unless-stopped
    ports:
      # Published to the host so LAN smart devices can subscribe to retained
      # door-state topics (cms/door/…). mosquitto.conf allows anonymous access,
      # so this trusts the LAN — do not forward 1883 past the router.
      - "1883:1883"
    expose:
      - "9001" # MQTT over WebSocket — internal only
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - E:/EC/cms-platform-data/mosquitto-data:/mosquitto/data
      - E:/EC/cms-platform-data/logs/mosquitto:/mosquitto/log
    networks:
      - internal
      - public # must be on public so the host port binding resolves (internal: true blocks it)

  # ─── API (Hono) ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: cms-api
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_HOST=mosquitto
      - UPLOAD_DIR=/data/uploads
      - LOG_DIR=/data/logs
      - BROADCAST_SECRET=${BROADCAST_SECRET}
      # HA_URL / HA_TOKEN / HA_ENTITY_ID come from .env.production above, NOT from
      # the root .env passed via --env-file. They used to be re-declared here, and
      # because `environment:` overrides `env_file:`, that silently replaced
      # .env.production's correct HA_URL=http://homeassistant:8123 with the root
      # .env's http://localhost:8123 — which inside this container is the API
      # itself, so every door-lock call died with ECONNREFUSED.
      - CAMERA_SCREEN_MAP=${CAMERA_SCREEN_MAP}
      - DETECTION_MIN_CONFIDENCE=${DETECTION_MIN_CONFIDENCE}
      # Face crops written by the (host-native) vision service; the API
      # streams them to the CMS behind admin auth.
      - VISION_IMAGE_DIR=/data/faces
    expose:
      - "4000" # internal only
    volumes:
      - E:/EC/cms-platform-data/uploads:/data/uploads
      - E:/EC/cms-platform-data/logs:/data/logs
      - E:/EC/cms-platform-data/faces:/data/faces
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - internal
      - public # needs outbound internet for the Tuya cloud IR API (internal: true blocks it)

  # ─── CMS Admin (Next.js) ────────────────────────────────────────────────────
  cms:
    build:
      context: ../..
      dockerfile: apps/cms/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: /ws
        NEXT_PUBLIC_WS_GATEWAY_URL: /ws
        NEXT_PUBLIC_VISION_WS_URL: ${NEXT_PUBLIC_VISION_WS_URL:-/vision/ws}
    container_name: cms-admin
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/ws
      - NEXT_PUBLIC_WS_GATEWAY_URL=/ws
      - UPLOAD_DIR=/data/uploads
      - LOG_DIR=/data/logs
      - BROADCAST_SECRET=${BROADCAST_SECRET}
      - INTERNAL_API_URL=http://api:4000
      - NEXT_PUBLIC_VISION_WS_URL=${NEXT_PUBLIC_VISION_WS_URL:-/vision/ws}
    expose:
      - "3000" # internal only
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

  # ─── Vision Inference (GPU) ─────────────────────────────────────────────────
  # FastAPI + YOLO on CUDA. Model weights are baked into the image at build time.
  # Start with: pnpm vision-server:up
  vision-inference:
    profiles: [vision-server]
    build:
      context: ../../services/product-vision
      dockerfile: Dockerfile.server
    container_name: vision-inference
    restart: unless-stopped
    environment:
      - VISION_SERVER_MODEL_PATH=/app/models/production/coster-v1.pt
      - VISION_SERVER_DEVICE=cuda:0
      - VISION_SERVER_CONF_THRESHOLD=${DETECTION_MIN_CONFIDENCE:-0.4}
      # Verified against the baked-in weight at startup (see models/production/checksums.txt)
      - VISION_SERVER_MODEL_SHA256=7d5d63e971db2fcf0d866758c6d6dc1090fdb53e2ae3e4115dc0a8fecc65f6ec
      # Safety floor only — the one-in-flight busy flag is the real throttle;
      # this just stops a runaway/misbehaving client.
      - VISION_SERVER_MIN_FRAME_INTERVAL_MS=10
    expose: ["8000"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/vision/readyz',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - internal

  # ─── Face Vision (GPU) — OPTIONAL, Linux hosts only ─────────────────────────
  # Entrance visitor recognition (insightface + pgvector). NOT usable under
  # Docker Desktop on Windows: USB / RealSense cameras cannot be passed into a
  # container there, so the primary deployment runs natively on the Windows host
  # (see services/vision/README.md). Kept here for a future Linux host.
  face-inference:
    profiles: [face-vision]
    build:
      context: ../../services/vision
      dockerfile: Dockerfile.server
    container_name: face-inference
    restart: unless-stopped
    environment:
      - VISION_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - VISION_API_URL=http://api:4000
      - BROADCAST_SECRET=${BROADCAST_SECRET}
      - VISION_IMAGE_DIR=/data/faces
      - VISION_CAMERAS=[{"id":"cam-entrance","mode":"PEOPLE","backend":"realsense","index":0}]
    volumes:
      - E:/EC/cms-platform-data/faces:/data/faces
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - internal

  # ─── Home Assistant (Yale lock event source) ───────────────────────────────
  # Container install (core + integrations only, no Supervisor/add-ons — that's
  # the right choice alongside an existing compose stack). Bridge network, not
  # host: the August/Yale integration is cloud-based, not local discovery, and
  # Docker Desktop's host mode here would only share the WSL2 VM's network
  # namespace anyway, not the real Windows LAN adapter.
  homeassistant:
    profiles: [home-assistant]
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: cms-homeassistant
    restart: unless-stopped
    ports:
      - "8123:8123" # HA web UI — onboarding, adding the Yale lock, automations
    volumes:
      - E:/EC/cms-platform-data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - public
      - internal # so cms-api can reach it directly (http://homeassistant:8123) —
                 # the internal network has no route to the host's own LAN IP

  # ─── Nginx (only public entry point) ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cms-nginx
    restart: unless-stopped
    ports:
      - "80:80" # the ONLY Docker entry point exposed to the host
      - "443:443"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
      - E:/EC/cms-platform-data/logs/nginx:/var/log/nginx
    depends_on:
      - cms
      - api
    networks:
      - internal
      - public

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: true # no direct internet access from any container on this network
  public:
    driver: bridge # Nginx bridges the host and internal services
