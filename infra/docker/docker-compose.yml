# CMS Platform — Full Docker Stack
# All services run in containers. Only Nginx is exposed on port 80.
# PostgreSQL and MQTT are on the internal network — never reachable from outside.
#
# Start:  docker compose --env-file ../../.env -f docker-compose.yml up -d
# Stop:   docker compose -f docker-compose.yml down
# Logs:   docker compose -f docker-compose.yml logs -f
# Build:  docker compose --env-file ../../.env -f docker-compose.yml build

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # exposed to host for drizzle-kit and local dev tools
    volumes:
      - E:/EC/cms-platform-data/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - public # must be on public so the host port binding resolves (internal: true blocks it)

  # ─── Mosquitto MQTT Broker ──────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cms-mosquitto
    restart: unless-stopped
    expose:
      - "1883" # MQTT — internal only
      - "9001" # MQTT over WebSocket — internal only
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - E:/EC/cms-platform-data/mosquitto-data:/mosquitto/data
      - E:/EC/cms-platform-data/logs/mosquitto:/mosquitto/log
    networks:
      - internal

  # ─── API (Hono) ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: cms-api
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_HOST=mosquitto
      - UPLOAD_DIR=/data/uploads
      - LOG_DIR=/data/logs
      - BROADCAST_SECRET=${BROADCAST_SECRET}
      - CAMERA_SCREEN_MAP=${CAMERA_SCREEN_MAP}
      - DETECTION_MIN_CONFIDENCE=${DETECTION_MIN_CONFIDENCE}
    expose:
      - "4000" # internal only
    volumes:
      - E:/EC/cms-platform-data/uploads:/data/uploads
      - E:/EC/cms-platform-data/logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - internal

  # ─── CMS Admin (Next.js) ────────────────────────────────────────────────────
  cms:
    build:
      context: ../..
      dockerfile: apps/cms/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: /ws
        NEXT_PUBLIC_WS_GATEWAY_URL: /ws
        NEXT_PUBLIC_VISION_INFERENCE_MODE: ${NEXT_PUBLIC_VISION_INFERENCE_MODE:-browser}
        NEXT_PUBLIC_VISION_WS_URL: ${NEXT_PUBLIC_VISION_WS_URL:-/vision/ws}
    container_name: cms-admin
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/ws
      - NEXT_PUBLIC_WS_GATEWAY_URL=/ws
      - UPLOAD_DIR=/data/uploads
      - LOG_DIR=/data/logs
      - BROADCAST_SECRET=${BROADCAST_SECRET}
      - INTERNAL_API_URL=http://api:4000
      - NEXT_PUBLIC_VISION_INFERENCE_MODE=${NEXT_PUBLIC_VISION_INFERENCE_MODE:-browser}
      - NEXT_PUBLIC_VISION_WS_URL=${NEXT_PUBLIC_VISION_WS_URL:-/vision/ws}
    expose:
      - "3000" # internal only
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

  # ─── Nginx (only public entry point) ────────────────────────────────────────
  # Product Vision (Python camera detector) — Model A, always-on. Needs the host
  # camera exposed to Docker Desktop's WSL2 VM first (see usbipd-win setup notes
  # in the plan); adjust the device path below to match `usbipd`/`ls /dev/video*`.
  # Start with: pnpm vision:up  (or: docker compose --profile vision up -d product-vision)
  product-vision:
    profiles:
      - vision
    build:
      context: ../../services/product-vision
      dockerfile: Dockerfile
    container_name: product-vision
    restart: unless-stopped
    env_file:
      - ../../services/product-vision/.env
    environment:
      - CMS_WEBSOCKET_URL=ws://api:4000/ws/
      - VISION_MODEL_PATH=models/production/coster-v1.pt
    volumes:
      - ../../services/product-vision/models:/app/models:ro
    devices:
      - "/dev/video0:/dev/video0"
    group_add:
      - "video"
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

  # Product Vision — Model B, template-gated. Same image/codebase as above, run
  # as a second instance against a second camera, only active while its mapped
  # screen is showing VISION_GATE_TEMPLATE_KEY (see services/product-vision/.env.gated).
  product-vision-gated:
    profiles:
      - vision
    build:
      context: ../../services/product-vision
      dockerfile: Dockerfile
    container_name: product-vision-gated
    restart: unless-stopped
    env_file:
      - ../../services/product-vision/.env.gated
    environment:
      - CMS_WEBSOCKET_URL=ws://api:4000/ws/
    volumes:
      - ../../services/product-vision/models:/app/models:ro
    devices:
      - "/dev/video1:/dev/video0"
    group_add:
      - "video"
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

  vision-inference:
    profiles: [vision-server]
    build:
      context: ../../services/product-vision
      dockerfile: Dockerfile.server
    container_name: vision-inference
    restart: unless-stopped
    environment:
      - VISION_SERVER_MODEL_PATH=/app/models/production/coster-v1.pt
      - VISION_SERVER_DEVICE=cuda:0
      - VISION_SERVER_CONF_THRESHOLD=${DETECTION_MIN_CONFIDENCE:-0.4}
    expose: ["8000"]
    volumes:
      - ../../services/product-vision/models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/vision/readyz',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - internal



  nginx:
    image: nginx:alpine
    container_name: cms-nginx
    restart: unless-stopped
    ports:
      - "80:80" # the ONLY Docker entry point exposed to the host
      - "443:443"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
      - E:/EC/cms-platform-data/logs/nginx:/var/log/nginx
    depends_on:
      - cms
      - api
    networks:
      - internal
      - public

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: true # no direct internet access from any container on this network
  public:
    driver: bridge # Nginx bridges the host and internal services
