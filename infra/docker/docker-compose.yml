# CMS Platform — Full Docker Stack
# All services run in containers. Only Nginx is exposed on port 80.
# PostgreSQL and MQTT are on the internal network — never reachable from outside.
#
# Start:  docker compose --env-file ../../.env -f docker-compose.yml up -d
# Stop:   docker compose -f docker-compose.yml down
# Logs:   docker compose -f docker-compose.yml logs -f
# Build:  docker compose --env-file ../../.env -f docker-compose.yml build

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"          # exposed to host for drizzle-kit and local dev tools
    volumes:
      - E:/EC/cms-platform-data/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - public          # must be on public so the host port binding resolves (internal: true blocks it)

  # ─── Mosquitto MQTT Broker ──────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cms-mosquitto
    restart: unless-stopped
    expose:
      - "1883"          # MQTT — internal only
      - "9001"          # MQTT over WebSocket — internal only
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - E:/EC/cms-platform-data/mosquitto-data:/mosquitto/data
      - E:/EC/cms-platform-data/logs/mosquitto:/mosquitto/log
    networks:
      - internal

  # ─── API (Hono) ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: cms-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_HOST=mosquitto
      - UPLOAD_DIR=/data/uploads
      - LOG_DIR=/data/logs
      - BROADCAST_SECRET=${BROADCAST_SECRET}
      - CONFIG_DIR=/app/apps/screens/public/config
      - CAMERA_SCREEN_MAP=${CAMERA_SCREEN_MAP}
      - DETECTION_MIN_CONFIDENCE=${DETECTION_MIN_CONFIDENCE}
    expose:
      - "4000"          # internal only
    volumes:
      - E:/EC/cms-platform-data/uploads:/data/uploads
      - E:/EC/cms-platform-data/logs:/data/logs
      - ../../apps/screens/public/config:/app/apps/screens/public/config
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - internal

  # ─── CMS Admin (Next.js) ────────────────────────────────────────────────────
  cms:
    build:
      context: ../..
      dockerfile: apps/cms/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: /ws
        NEXT_PUBLIC_WS_GATEWAY_URL: /ws
        NEXT_PUBLIC_SCREENS_URL: /display
    container_name: cms-admin
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/ws
      - NEXT_PUBLIC_WS_GATEWAY_URL=/ws
      - NEXT_PUBLIC_SCREENS_URL=/display
      - UPLOAD_DIR=/data/uploads
      - LOG_DIR=/data/logs
      - BROADCAST_SECRET=${BROADCAST_SECRET}
      - INTERNAL_API_URL=http://api:4000
    expose:
      - "3000"          # internal only
    volumes:
      - ../../apps/screens/public/config:/app/apps/screens/public/config
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

  # ─── Screens Player (Next.js) ───────────────────────────────────────────────
  screens:
    build:
      context: ../..
      dockerfile: apps/screens/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: /ws
        NEXT_PUBLIC_WS_GATEWAY_URL: /ws
        NEXT_PUBLIC_SCREENS_BASE_PATH: /display
    container_name: cms-screens
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/ws
      - NEXT_PUBLIC_WS_GATEWAY_URL=/ws
      - NEXT_PUBLIC_SCREENS_BASE_PATH=/display
      - INTERNAL_API_URL=http://api:4000   # server-side: reach the Hono API by service name (not localhost)
      - UPLOAD_DIR=/data/uploads
      - LOG_DIR=/data/logs
    expose:
      - "3001"          # internal only
    volumes:
      - ../../apps/screens/public/config:/app/apps/screens/public/config
    depends_on:
      api:
        condition: service_started
    networks:
      - internal

  # ─── Nginx (only public entry point) ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: cms-nginx
    restart: unless-stopped
    ports:
      - "80:80"         # the ONLY port exposed to the host in this entire stack
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - E:/EC/cms-platform-data/logs/nginx:/var/log/nginx
    depends_on:
      - cms
      - screens
      - api
    networks:
      - internal
      - public

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: true      # no direct internet access from any container on this network
  public:
    driver: bridge      # Nginx bridges the host and internal services
