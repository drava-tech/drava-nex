version: '3.8'

# MODE B — PostgreSQL runs in Docker
# Use this when you want Postgres containerised.
# Data is stored on the Windows host at: ../../postgres-data (two levels up from this file)
#
# Run from repo root:
#   docker compose --env-file .env -f infra/docker/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cms_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cms_db}
    volumes:
      - ../../postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms_app} -d ${POSTGRES_DB:-cms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: platform-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: platform-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mosquitto
    restart: unless-stopped

# No named volumes — Postgres data lives on the host at ../../postgres-data
