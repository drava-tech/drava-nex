# CMS Platform — Full Docker Stack
# All services run in containers. HTTP(S) comes in through the shared edge stack
# (E:\edge, which must be up first) to this stack's nginx. PostgreSQL (5432)
# and MQTT (1883) are published to the host so local dev tools and LAN
# smart devices can reach them. Everything else stays on the internal network.
#
# Start:  docker compose --env-file ../../.env -f docker-compose.yml up -d
# Stop:   docker compose -f docker-compose.yml down
# Logs:   docker compose -f docker-compose.yml logs -f
# Build:  docker compose --env-file ../../.env -f docker-compose.yml build

# Project name. Without it Compose names the project after this folder
# ("docker"), which is what Docker Desktop showed and what prefixed the images
# (docker-api, docker-cms) and networks. Built images are now nexus-api /
# nexus-cms. The Postgres volumes at the bottom keep their old docker_* names
# on purpose — see the note there.
name: nexus

# ─── Shared log policy ───────────────────────────────────────────────────────
# Applied to EVERY service below. Docker's stock json-file driver has no size
# cap, so container logs grow without bound inside the WSL2 VHDX — and that
# VHDX never shrinks on its own. That is the exact mechanism that filled C: and
# crashed Docker Desktop mid-build once already (see the LAN deployment notes).
# 50m x 5 caps each container at 250 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  # pgvector build of Postgres 18 (Debian-based). Upgraded from pg16 by dump/restore
  # into the postgres18-data volume (PG18 keeps data under /var/lib/postgresql/18). The vector
  # extension is required by the vision service's visitor table (migration 0010).
  postgres:
    image: pgvector/pgvector:0.8.5-pg18
    container_name: cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # exposed to host for drizzle-kit and local dev tools
    volumes:
      # NOTE: a Windows bind mount is the wrong home for a Postgres data
      # directory under Docker Desktop — it is proxied to NTFS over
      # 9p/virtiofs, which makes every WAL fsync and buffer write brutally
      # slow, and it is the largest single contributor to platform-wide
      # slowness. Move it to a native Docker volume with:
      #   pwsh infra/scripts/migrate-postgres-to-volume.ps1
      # (takes the stack down; dumps, switches and restores, verifying row
      # counts, and leaves the old directory untouched for rollback).
      - postgres18-data:/var/lib/postgresql
    # Docker's default /dev/shm is 64 MB. Postgres uses it for parallel query
    # and hash-join work areas, and past that ceiling it fails outright with
    # "could not resize shared memory segment" under exactly the concurrent
    # load where the dashboard's aggregate queries need it most.
    shm_size: 1gb
    logging: *default-logging
    # Sized for headroom, not for today: the database is ~13 MB and already
    # 99.96% cache-resident, so these are about not having to revisit this when
    # the pgvector visitor_embedding table grows. The two settings that matter
    # RIGHT NOW are random_page_cost and effective_io_concurrency — the stock
    # values (4 and 1) describe a spinning disk, and this box is NVMe, so the
    # planner was systematically over-pricing index scans.
    #
    # pg_stat_statements is the point of the exercise: without it "which query
    # is slow" is unanswerable and every future perf question becomes guesswork.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=16GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_worker_processes=16
      - -c
      - max_parallel_workers=16
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - wal_buffers=64MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 8G
        reservations:
          memory: 2G
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - public # must be on public so the host port binding resolves (internal: true blocks it)

  # ─── Mosquitto MQTT Broker ──────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cms-mosquitto
    restart: unless-stopped
    ports:
      # Published to the host so LAN smart devices can subscribe to retained
      # door-state topics (cms/door/…). mosquitto.conf allows anonymous access,
      # so this trusts the LAN — do not forward 1883 past the router.
      - "1883:1883"
    expose:
      - "9001" # MQTT over WebSocket — internal only
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - E:/EC/cms-platform-data/mosquitto-data:/mosquitto/data
      - E:/EC/cms-platform-data/logs/mosquitto:/mosquitto/log
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    networks:
      - internal
      - public # must be on public so the host port binding resolves (internal: true blocks it)

  # ─── API (Hono) ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: cms-api
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      # NOTE: DATABASE_URL, MQTT_*, BROADCAST_SECRET, CAMERA_SCREEN_MAP and
      # DETECTION_MIN_CONFIDENCE all come from .env.production above. They are
      # deliberately NOT re-declared here.
      #
      # `environment:` overrides `env_file:`, so a line like
      #   DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # silently becomes  postgresql://:@postgres:5432/  whenever compose runs
      # WITHOUT --env-file ../../.env, because the interpolations resolve to
      # empty. That took the database down on 2026-09-04 ("no PostgreSQL user
      # name specified in startup packet"), and the same trap had already
      # broken HA_URL. Values that must differ inside the container belong in
      # .env.production, not in an interpolated override here.
      - UPLOAD_DIR=/data/uploads
      - LOG_DIR=/data/logs
      # HA_URL / HA_TOKEN / HA_ENTITY_ID come from .env.production above, NOT from
      # the root .env passed via --env-file. They used to be re-declared here, and
      # because `environment:` overrides `env_file:`, that silently replaced
      # .env.production's correct HA_URL=http://homeassistant:8123 with the root
      # .env's http://localhost:8123 — which inside this container is the API
      # itself, so every door-lock call died with ECONNREFUSED.
      # Face crops written by the (host-native) vision service; the API
      # streams them to the CMS behind admin auth.
      - VISION_IMAGE_DIR=/data/faces
      # libuv defaults to FOUR threads. Every sharp thumbnail encode and every
      # fs.createReadStream media read contends over that pool, on a 24-thread
      # box. This is the one place where "use more CPU" is genuinely the fix.
      - UV_THREADPOOL_SIZE=16
      # An explicit ceiling so a large upload fails inside the container's own
      # limit instead of ballooning the process and destabilising the host.
      - NODE_OPTIONS=--max-old-space-size=3072
    expose:
      - "4000" # internal only
    volumes:
      - E:/EC/cms-platform-data/uploads:/data/uploads
      - E:/EC/cms-platform-data/logs:/data/logs
      - E:/EC/cms-platform-data/faces:/data/faces
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    healthcheck:
      # /health is served by apps/api/src/index.ts and reports db + mqtt state.
      # node -e rather than curl/wget: the alpine image has neither guaranteed.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - internal
      - public # needs outbound internet for the Tuya cloud IR API (internal: true blocks it)

  # ─── CMS Admin (Next.js) ────────────────────────────────────────────────────
  cms:
    build:
      context: ../..
      dockerfile: apps/cms/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: /ws
        NEXT_PUBLIC_WS_GATEWAY_URL: /ws
        NEXT_PUBLIC_VISION_WS_URL: ${NEXT_PUBLIC_VISION_WS_URL:-/vision/ws}
    container_name: cms-admin
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      # Same reasoning as the api service above: DATABASE_URL and
      # BROADCAST_SECRET come from .env.production, never from an
      # interpolated override that empties itself without --env-file.
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_WS_URL=/ws
      - NEXT_PUBLIC_WS_GATEWAY_URL=/ws
      - UPLOAD_DIR=/data/uploads
      - LOG_DIR=/data/logs
      - INTERNAL_API_URL=http://api:4000
      - NEXT_PUBLIC_VISION_WS_URL=${NEXT_PUBLIC_VISION_WS_URL:-/vision/ws}
      - UV_THREADPOOL_SIZE=16
      - NODE_OPTIONS=--max-old-space-size=3072
    expose:
      - "3000" # internal only
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
    healthcheck:
      # Hits the CMS's own health route, NOT /health — that path is rewritten
      # to the API (next.config.mjs), so it would report the API's liveness and
      # this container could be wedged while still looking healthy.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/cms-health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      api:
        # Was service_started, so nothing waited for the API to be USABLE —
        # the CMS could boot and serve pages against a database that had not
        # finished coming up.
        condition: service_healthy
    networks:
      - internal

  # ─── Vision Inference (GPU) ─────────────────────────────────────────────────
  # FastAPI + YOLO on CUDA. Model weights are baked into the image at build time.
  # Start with: pnpm vision-server:up
  vision-inference:
    profiles: [vision-server]
    build:
      context: ../../services/product-vision
      dockerfile: Dockerfile.server
    container_name: vision-inference
    restart: unless-stopped
    environment:
      - VISION_SERVER_MODEL_PATH=/app/models/production/coster-v1.pt
      - VISION_SERVER_DEVICE=cuda:0
      - VISION_SERVER_CONF_THRESHOLD=${DETECTION_MIN_CONFIDENCE:-0.4}
      # Verified against the baked-in weight at startup (see models/production/checksums.txt)
      - VISION_SERVER_MODEL_SHA256=7d5d63e971db2fcf0d866758c6d6dc1090fdb53e2ae3e4115dc0a8fecc65f6ec
      # Safety floor only — the one-in-flight busy flag is the real throttle;
      # this just stops a runaway/misbehaving client.
      - VISION_SERVER_MIN_FRAME_INTERVAL_MS=10
    expose: ["8000"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/vision/readyz',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - internal

  # ─── Face Vision (GPU) — OPTIONAL, Linux hosts only ─────────────────────────
  # Entrance visitor recognition (insightface + pgvector). NOT usable under
  # Docker Desktop on Windows: USB / RealSense cameras cannot be passed into a
  # container there, so the primary deployment runs natively on the Windows host
  # (see services/vision/README.md). Kept here for a future Linux host.
  face-inference:
    profiles: [face-vision]
    build:
      context: ../../services/vision
      dockerfile: Dockerfile.server
    container_name: face-inference
    restart: unless-stopped
    environment:
      - VISION_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - VISION_API_URL=http://api:4000
      - BROADCAST_SECRET=${BROADCAST_SECRET}
      - VISION_IMAGE_DIR=/data/faces
      - VISION_CAMERAS=[{"id":"cam-entrance","mode":"PEOPLE","backend":"realsense","index":0}]
    volumes:
      - E:/EC/cms-platform-data/faces:/data/faces
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - internal

  # ─── Home Assistant (Yale lock event source) ───────────────────────────────
  # Container install (core + integrations only, no Supervisor/add-ons — that's
  # the right choice alongside an existing compose stack). Bridge network, not
  # host: the August/Yale integration is cloud-based, not local discovery, and
  # Docker Desktop's host mode here would only share the WSL2 VM's network
  # namespace anyway, not the real Windows LAN adapter.
  homeassistant:
    profiles: [home-assistant]
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: cms-homeassistant
    restart: unless-stopped
    ports:
      - "8123:8123" # HA web UI — onboarding, adding the Yale lock, automations
    volumes:
      - E:/EC/cms-platform-data/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    networks:
      - public
      - internal # so cms-api can reach it directly (http://homeassistant:8123) —
                 # the internal network has no route to the host's own LAN IP

  # ─── Nginx (nexus's entry point, behind edge) ───────────────────────────────
  # No host ports: the shared edge Caddy (E:\edge) owns 80/443 for every project
  # on this box and forwards ec-cms / 192.168.1.250 / nexus.tailb6da34.ts.net
  # here over the `edge` network. nginx keeps all of nexus's own routing.
  nginx:
    image: nginx:alpine
    container_name: cms-nginx
    restart: unless-stopped
    expose:
      - "80"
      - "443"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
      # The /var/log/nginx bind mount is deliberately GONE. nginx now logs to
      # stdout/stderr (the official image symlinks them), so Docker's rotation
      # policy above covers it like every other service. On the bind mount there
      # was no logrotate in the container at all and the files had reached
      # 249 MB (access) + 226 MB (error) and were still growing.
      # `docker logs cms-nginx` still greps for the timed format's rt=/urt=.
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    healthcheck:
      # Must send the canonical Host — server_name is ec-cms/192.168.1.250 and
      # anything else hits the catch-all `return 444`, which would look like an
      # outage while the stack is fine.
      test: ["CMD", "wget", "-q", "--spider", "--header=Host: ec-cms", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      # Was the short list form, i.e. start-order only. With conditions, nginx
      # cannot come up pointing at upstreams that are not yet serving.
      cms:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      internal: {}
      public: {}
      # The shared front door (E:\edge) reaches this nginx as nexus-web. Edge
      # also routes the private https://nexus.tailb6da34.ts.net address here.
      edge:
        aliases: [nexus-web]

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: true # no direct internet access from any container on this network
  public:
    driver: bridge # Nginx bridges the host and internal services
  # Owned by the edge stack (E:\edge\compose.yml), which must be up first.
  edge:
    external: true

# Native Docker volume for the Postgres data directory.
# Deliberately NOT a Windows bind mount: under Docker Desktop that path is
# proxied from the WSL2 VM to NTFS over 9p/virtiofs, which serialises every WAL
# fsync (measured 2.2 ms/commit vs ~0.2 ms here) and gives weaker durability
# guarantees than Postgres expects from its data directory.
#
# Both are pinned to their real names. Named volumes otherwise take the project
# prefix, so renaming the project to "nexus" would have silently pointed
# Postgres at a fresh, EMPTY nexus_postgres18-data volume.
volumes:
  postgres-data:
    name: docker_postgres-data # pre-pg18 data, kept for rollback
  postgres18-data:
    name: docker_postgres18-data # live database
