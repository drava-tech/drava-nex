version: '3.8'

# MODE A — Local Windows Development (not in use yet)
#
# Intentionally empty. The production stack (docker-compose.yml, `pnpm prod:up`)
# — cms-postgres, cms-mosquitto, cms-api, cms-admin, cms-nginx — is the single
# running entity for now. Services here previously collided with it on shared
