version: '3.8'

# MODE A — Local Windows Development (default)
# PostgreSQL and Mosquitto (MQTT) run in Docker.
# Node apps run locally via: pnpm dev (API :4000, CMS :3000)
#
# Run from repo root:
#   pnpm infra:up
# Or:
#   docker compose --env-file .env -f infra/docker/docker-compose.local.yml up -d

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: platform-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # Headless-Chromium render relay (see docker-compose.yml for the full comment).
  # The API itself runs natively here (`pnpm dev`), not in Docker, so it's
  # reached via host.docker.internal — same convention as infra/nginx/nginx.conf.
  browser-render:
    build:
      context: ../../services/browser-render
      dockerfile: Dockerfile
    container_name: platform-browser-render
    restart: unless-stopped
    shm_size: '1gb'
    environment:
      - WS_GATEWAY_URL=ws://host.docker.internal:4000/ws
      - BROADCAST_SECRET=${BROADCAST_SECRET}
      - MAX_SESSIONS=8
      - SCREENCAST_SCALE_FACTOR=3
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8090/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ponytail: Commented out local postgres service because we want everything
  # to connect directly to the production Postgres database at ec-cms.
  # NOTE: that server must have the pgvector extension installed (image
  # pgvector/pgvector:pg16 or postgresql-16-pgvector) before running
  # `pnpm --filter @platform/db db:migrate` — the visitor table needs it.
  # postgres:
  #   image: pgvector/pgvector:pg16
  #   container_name: platform-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: ${POSTGRES_DB}
  #     POSTGRES_USER: ${POSTGRES_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #   ports:
  #     - "${POSTGRES_PORT:-5432}:5432"
  #   volumes:
  #     - ../../postgres-data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
