version: '3.8'

# MODE A — Local Windows Development (default)
# PostgreSQL and Mosquitto (MQTT) run in Docker.
# Node apps run locally via: pnpm dev (API :4000, CMS :3000)
#
# Run from repo root:
#   pnpm infra:up
# Or:
#   docker compose --env-file .env -f infra/docker/docker-compose.local.yml up -d

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: platform-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # Local dev database — deliberately NOT the production Postgres. Dev work
  # (migrations, renames, scripts, voice-agent testing) must never write to the
  # database the live CMS runs on. Bound to 127.0.0.1 with throwaway dev
  # credentials; point the local .env DATABASE_URL at it:
  #   DATABASE_URL=postgresql://cms_dev:cms_dev@localhost:5433/cms_db_local
  # Needs pgvector (the visitor table uses it), hence the pgvector image.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cms_db_local
      POSTGRES_USER: cms_dev
      POSTGRES_PASSWORD: cms_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ../../postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_dev -d cms_db_local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
