version: '3.8'

# MODE A — Local Windows Development (default)
# PostgreSQL and Mosquitto (MQTT) run in Docker.
# Node apps run locally via: pnpm dev (API :4000, CMS :3000)
#
# Run from repo root:
#   pnpm infra:up
# Or:
#   docker compose --env-file .env -f infra/docker/docker-compose.local.yml up -d

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: platform-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms_db}
      POSTGRES_USER: ${POSTGRES_USER:-cms_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../../postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms_app} -d ${POSTGRES_DB:-cms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

