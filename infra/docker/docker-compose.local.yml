version: '3.8'

# MODE A — Local Windows Development (default)
# PostgreSQL runs natively on Windows (not in Docker).
# Only Mosquitto (MQTT) and Nginx run in Docker.
# Node apps run via: pnpm dev  (API :4000, CMS :3000, Screens :3001)
#
# Run from repo root:
#   docker compose --env-file .env -f infra/docker/docker-compose.local.yml up -d
#
# Or use the root script:
#   pnpm infra:up

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: platform-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../../postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: platform-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - mosquitto
      - postgres
    restart: unless-stopped
