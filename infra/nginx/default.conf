# ─── CMS Platform — Nginx Reverse Proxy ──────────────────────────────────────
# Docker mode: all upstreams use Docker service names (api, cms, screens).
# Only this Nginx container is exposed on port 80.
# PostgreSQL and MQTT are never proxied here — internal network only.
#
# Future SSL/domain setup:
#   1. Add a new server block listening on port 80 that redirects to 443
#   2. Add: listen 443 ssl;
#          ssl_certificate     /etc/nginx/certs/fullchain.pem;
#          ssl_certificate_key /etc/nginx/certs/privkey.pem;
#   3. Update server_name to your real domain

client_max_body_size 500M;

upstream api_upstream {
    server api:4000;
}

upstream cms_upstream {
    server cms:3000;
}



# ─── Reject any host that isn't the canonical static IP ──────────────────────
# Docker/LAN entry point: the stack is reachable via http://192.168.1.250.
# Local dev uses the CMS dev server at http://localhost:3000 instead.
# This default server catches unknown Host headers and closes the connection.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name 192.168.1.250;

    # ─── CMS-owned API routes (Next.js app) — MUST precede the generic /api/ ───
    # These endpoints live in the CMS Next app, NOT the Hono API. The ^~ prefix
    # takes priority over the generic /api/ prefix below, so login/session,
    # uploads, and media are routed to the CMS instead of 404ing on the API.
    location ^~ /api/auth/ {
        proxy_pass http://cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/upload {
        proxy_pass http://cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/media {
        proxy_pass http://cms_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── API REST routes ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Health check (root-level alias) ─────────────────────────────────────
    location /health {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket ────────────────────────────────────────────────────────────
    # Exact /ws (no trailing slash) — the app clients (screen player + CMS) connect
    # here. Must upgrade, not 301-redirect to /ws/ (WS handshakes can't follow a
    # redirect, which silently kills all real-time sync).
    location = /ws {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~* ^/_next/static/ {
        proxy_pass http://cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # NOTE: /screens and /screens/[id] are CMS routes now — they fall through to the
    # catch-all `location /` (cms_upstream) below.

    # ─── CMS admin — catch-all (must be last) ────────────────────────────────
    location / {
        proxy_pass http://cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never cache HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
