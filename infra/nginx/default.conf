# ─── nexus — nginx, the app's own router ─────────────────────────────────────
# Two layers, two jobs:
#   - E:\edge (Caddy, another repo) is the FRONT DOOR for every project on this
#     host: it owns the host ports, client TLS, the Cloudflare tunnel (with its
#     Access login for nexus) and the real client IP. It picks the PROJECT by
#     hostname/port and forwards here over the `edge` network as nexus-web.
#   - This nginx picks the PATH (api vs cms, plain http for TVs, uploads,
#     streaming, websockets). Those rules change with the app, so they live
#     here, next to the code.
#
# Caddy uses :80 for plain-http LAN clients (TVs, kiosks) and :443 for everyone
# on https (LAN browsers, the APK, the public name). The port a request arrives
# on is how this file knows whether the client itself used https.
#
# Routes both servers share are in ../snippets/nexus-routes.conf (mounted at
# /etc/nginx/snippets). Only the differences between :80 and :443 are below.
# Apply a change: docker exec cms-nginx nginx -t && docker exec cms-nginx nginx -s reload

# ─── Request timing ──────────────────────────────────────────────────────────
# rt = total request time, urt = time the upstream (CMS/API) took.
# rt >> urt means nginx/network; rt ~= urt means the app.
log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time "$http_user_agent"';

# Must not be SMALLER than the API's MAX_UPLOAD_BYTES (apps/api/src/routes/
# media.ts) or nginx 413s a file the platform would accept. Both are 1 GiB.
# (Through the public name, Cloudflare Free caps uploads at 100 MB anyway.)
client_max_body_size 1024M;

# ─── Compression ─────────────────────────────────────────────────────────────
# HTML, RSC payloads and JSON are highly compressible and mostly uncacheable.
# Video/image types are deliberately NOT listed: already compressed, and
# gzipping them only burns CPU on the range-streaming path.
gzip on;
gzip_vary on;
gzip_proxied any;          # these responses all come from a proxied upstream
gzip_comp_level 5;         # past ~5 the CPU cost outruns the bytes saved
gzip_min_length 1024;      # below this the gzip header outweighs the savings
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/rsc          # Next.js RSC payloads
    text/x-component         # …and the content-type Next actually sends for them
    image/svg+xml
    font/ttf
    font/otf;

# ─── Upstream resolution ─────────────────────────────────────────────────────
# Every proxy_pass points at a VARIABLE ($api_up, $cms_up, $vision_up in the
# snippet), which makes nginx re-resolve the name through Docker's DNS per
# request: a recreated api/cms container is picked up within 10 s, with no
# `docker restart cms-nginx`. (An `upstream {}` block resolves once at load and
# keeps proxying to the dead IP.) Trade-off: no upstream keepalive pool, which
# costs a sub-millisecond TCP handshake per request on this LAN hop.
resolver 127.0.0.11 valid=10s ipv6=off;

# ─── Real client address ─────────────────────────────────────────────────────
# Everything arrives through the edge Caddy (pinned 172.30.0.10), which works
# out the real client once (Cf-Connecting-IP for the public name, the socket
# address on the LAN) and sends it as a single-value X-Forwarded-For. Trusted
# from Caddy only, so nobody can choose their own address. The headers below
# then pass ONLY that address upstream: better-auth's login rate limit keys on
# the first X-Forwarded-For entry.
set_real_ip_from 172.30.0.10;
real_ip_header X-Forwarded-For;

# ─── Proxy headers: set ONCE, here ───────────────────────────────────────────
# Every location inherits these. A location must NOT set its own
# proxy_set_header: nginx then drops ALL of the inherited ones for it.
# Upgrade/Connection make every location websocket-capable (/ws, /vision/ws);
# for a normal request $http_upgrade is empty (nginx omits the header) and
# Connection is "close", exactly nginx's default.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# ─── Static file descriptor cache ────────────────────────────────────────────
open_file_cache max=10000 inactive=5m;
open_file_cache_valid 2m;
open_file_cache_min_uses 2;
open_file_cache_errors on;

# ─── Our certificate (for the hop from Caddy) ────────────────────────────────
# Issued by the edge CA for the name nexus-web (E:\edge\nexus\nexus-web.*,
# mounted by infra/docker/docker-compose.yml); Caddy verifies it against that CA.
ssl_certificate     /etc/nginx/edge/nexus-web.crt;
ssl_certificate_key /etc/nginx/edge/nexus-web.key;
ssl_protocols       TLSv1.2 TLSv1.3;

# ─── Unknown hosts get no answer, on both ports ──────────────────────────────
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    return 444;
}

# ─── :80 — plain HTTP, for TVs and kiosks on the LAN ─────────────────────────
# TV/kiosk displays stay on http (the mkcert CA isn't installed on them), and
# /display, /media and everything they load are public, unauthenticated.
# Session-bearing routes (/api/auth/*, the dashboard) redirect to https:
# better-auth issues Secure cookies, which browsers drop over plain http.
server {
    listen 80;
    server_name ec-cms 192.168.1.250;

    include /etc/nginx/snippets/nexus-routes.conf;

    # Login/session — force HTTPS so Secure cookies are actually stored.
    location ^~ /api/auth/ {
        return 301 https://$host$request_uri;
    }

    # TV display — stays on plain HTTP.
    location ^~ /display {
        proxy_pass $cms_up;
    }

    # Data Art Studio pages — iframed by the display, so also plain HTTP.
    # Without this the catch-all below would 301 the display's iframe to https.
    location ^~ /data-art-studio/ {
        proxy_pass $cms_up;
    }

    # The dashboard and everything else — force HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── :443 — HTTPS, everything served ─────────────────────────────────────────
# LAN browsers and the APK (https://ec-cms, https://192.168.1.250) and the
# public name (Cloudflare tunnel; Access login in front). nexus-web is the
# name Caddy dials (SNI); it is only reachable on the edge network.
server {
    listen 443 ssl;
    server_name ec-cms 192.168.1.250 nexus.drava.technology nexus-web;

    include /etc/nginx/snippets/nexus-routes.conf;

    # No self sign-up: nexus is reachable from the internet. Admins add users
    # from the Users page, which calls auth.api.signUpEmail inside the api and
    # never comes through here. (Port 80 already 301s every /api/auth/ here.)
    location ^~ /api/auth/sign-up/ {
        default_type application/json;
        return 403 '{"error":"Sign-up is disabled. Ask an administrator for an account."}';
    }

    # CMS — catch-all: the dashboard, /screens, /display, /data-art-studio…
    location / {
        proxy_pass $cms_up;
        # Never cache HTML.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
