# ─── CMS Platform — Nginx Reverse Proxy ──────────────────────────────────────
# Docker mode: all upstreams use Docker service names (api, cms, screens).
# Only this Nginx container is exposed on port 80.
# PostgreSQL and MQTT are never proxied here — internal network only.
#
# Future SSL/domain setup:
#   1. Add a new server block listening on port 80 that redirects to 443
#   2. Add: listen 443 ssl;
#          ssl_certificate     /etc/nginx/certs/fullchain.pem;
#          ssl_certificate_key /etc/nginx/certs/privkey.pem;
#   3. Update server_name to your real domain

client_max_body_size 500M;

upstream api_upstream {
    server api:4000;
}

upstream cms_upstream {
    server cms:3000;
}

upstream screens_upstream {
    server screens:3001;
}

server {
    listen 80;
    server_name localhost;

    # ─── API REST routes ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Health check (root-level alias) ─────────────────────────────────────
    location /health {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket ────────────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── Hashed static assets — cache forever (content hash changes on rebuild) ─
    # These never cause ChunkLoadError because new builds = new filenames
    location ~* ^/(screens/)?_next/static/ {
        proxy_pass http://screens_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/_next/static/ {
        proxy_pass http://cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ─── Screens player ───────────────────────────────────────────────────────
    # No trailing slash — prefix is NOT stripped. Screens app uses basePath:/screens
    # so Next.js expects /screens/... paths and serves _next/static under /screens/_next/
    location /screens/ {
        proxy_pass http://screens_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never cache HTML — browser always gets fresh entry point with new chunk hashes
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─── CMS admin — catch-all (must be last) ────────────────────────────────
    location / {
        proxy_pass http://cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never cache HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
