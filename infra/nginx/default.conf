# ─── CMS Platform — Nginx Reverse Proxy ──────────────────────────────────────
# Docker mode: upstreams use Docker service names (api, cms). The CMS also serves
# the /display player (single origin). Only this Nginx container is on port 80.
# PostgreSQL and MQTT are never proxied here — internal network only.
#
# Future SSL/domain setup:
#   1. Add a new server block listening on port 80 that redirects to 443
#   2. Add: listen 443 ssl;
#          ssl_certificate     /etc/nginx/certs/fullchain.pem;
#          ssl_certificate_key /etc/nginx/certs/privkey.pem;
#   3. Update server_name to your real domain

# ─── Request timing ──────────────────────────────────────────────────────────
# The stock log format records no timing, so "the app feels slow" cannot be
# answered from the logs. rt = total request time, urt = time the upstream
# (CMS/API) took. rt >> urt means nginx/network; rt ~= urt means the app.
log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time "$http_user_agent"';

# Must not be SMALLER than the API's MAX_UPLOAD_BYTES (apps/api/src/routes/
# media.ts) or nginx 413s a file the platform would happily accept, and the
# natural workaround is to re-export the master at a lower bitrate — baking in
# quality loss no display-side fix can undo. Both are 1 GiB.
client_max_body_size 1024M;

# ─── Compression ─────────────────────────────────────────────────────────────
# Applies to both server blocks below. Every HTML document, RSC payload and JSON
# API response was previously served uncompressed — a dashboard navigation moves
# several hundred KB of highly compressible text, and this stack is dynamic
# enough that almost none of it is cacheable.
#
# Deliberately NOT listing video/image types: they are already compressed, and
# gzipping them would only burn CPU on the range-streaming path. gzip_static is
# off because Next's standalone output isn't pre-compressed here.
gzip on;
gzip_vary on;
gzip_proxied any;          # these responses all come from a proxied upstream
gzip_comp_level 5;         # past ~5 the CPU cost outruns the bytes saved
gzip_min_length 1024;      # below this the gzip header outweighs the savings
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/rsc          # Next.js RSC payloads
    text/x-component         # …and the content-type Next actually sends for them
    image/svg+xml
    font/ttf
    font/otf;

# ─── Upstream resolution ─────────────────────────────────────────────────────
# An `upstream { server api:4000; }` block resolves the container's IP ONCE, at
# config load. Recreating api/cms gives them new IPs, nginx keeps proxying to
# the dead ones, and every route 502s until someone runs `docker restart
# cms-nginx` by hand — the recurring deploy gotcha in the LAN deployment notes.
#
# Pointing proxy_pass at a VARIABLE forces nginx to re-resolve through Docker's
# embedded DNS on each request, so a recreated container is picked up within the
# 10s TTL and the manual restart step is retired for good. This is the standard
# open-source nginx workaround (upstream `resolve` is an nginx Plus feature).
#
# Trade-off, taken deliberately: variable proxy_pass cannot use an upstream
# block, so there is no keepalive connection pooling. That costs a TCP handshake
# per proxied request — sub-millisecond on a container-to-container LAN hop
# against measured 4 ms responses, i.e. a few percent. A recurring 502 that
# needs manual intervention on every deploy is worth far more than that.
resolver 127.0.0.11 valid=10s ipv6=off;

# ─── Static file descriptor cache ────────────────────────────────────────────
# Keeps metadata for hot files (uploaded media, _next/static chunks) in RAM
# instead of re-stat()ing on every request. Cheap, and it is the kind of "use
# the memory we have" win that actually applies to this workload.
open_file_cache max=10000 inactive=5m;
open_file_cache_valid 2m;
open_file_cache_min_uses 2;
open_file_cache_errors on;



# ─── Reject any host that isn't the canonical LAN name/IP ─────────────────────
# Docker/LAN entry point: the stack is reachable via http://ec-cms, or via the
# raw IP http://192.168.1.250 for devices (e.g. phones) that can't resolve the
# hostname on this LAN.
# Local dev uses the CMS dev server at http://localhost:3000 instead.
# This default server catches unknown Host headers and closes the connection.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Plain http:// server — TV/kiosk displays stay on http (their mkcert CA isn't
# installed on those devices, and /display + everything it depends on is public,
# unauthenticated). Only the session-cookie-bearing routes (admin dashboard shell +
# /api/auth/*) redirect to https, since better-auth issues Secure/__Secure- cookies
# (baseURL is https) that browsers silently drop over plain http, causing a login loop.
server {
    listen 80;
    server_name ec-cms 192.168.1.250;

    # Re-resolved per request via the http-level resolver above — see the
    # comment there for why this is a variable and not an upstream block.
    set $api_up http://api:4000;
    set $cms_up http://cms:3000;
    access_log /dev/stdout timed;

    # ─── Login/session — force HTTPS so Secure cookies are actually stored ────
    location ^~ /api/auth/ {
        return 301 https://$host$request_uri;
    }

    # ─── TV display — stays on plain HTTP, unauthenticated ────────────────────
    location ^~ /display {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Data Art Studio pages — iframed by the display, so also plain HTTP ───
    # Static files the CMS serves from public/data-art-studio. Without this the
    # catch-all below would 301 the display's iframe to HTTPS.
    location ^~ /data-art-studio/ {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Data Art Studio videos — the API streams 4K renders from R2 ─────────
    # Unbuffered like /api/media, so a long clip streams instead of spooling
    # to nginx temp files first (see apps/api/src/routes/data-art-studio.ts).
    location ^~ /api/data-art-studio/video {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── Media (range streaming) — API route, buffering off for large video ────
    # Precedes the generic /api/ only to disable proxy buffering; same upstream.
    location ^~ /api/media {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A multi-hundred-MB video upload over anything less than a fast
        # connection can take well past nginx's 60s default, silently
        # aborting the request before the API ever writes the media_asset
        # row (upload just vanishes, nothing in the Media Library). Same
        # generous window as the /ws blocks below, for the same reason.
        client_body_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # The bare path (no filename, with or without trailing slash) isn't a real
    # asset — mediaFilesRouter only matches /media/:filename, so it would 404
    # from the API. Send both forms straight to the CMS Media Library page
    # instead. NOTE: don't try to redirect one form to the other here — nginx
    # has built-in behavior that auto-redirects a bare "/media" request to
    # "/media/" for any proxy_pass location whose prefix ends in "/" (like
    # `^~ /media/` below), so a manual `return 301 /media;` on `= /media/`
    # creates a real infinite redirect loop with that native behavior.
    location = /media/ {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /media {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Media Library's queue-push live-control page (/media/live/<screenId>)
    # — a CMS route, not an uploaded file, but it shares the /media/ prefix
    # with the uploaded-media block below. Must be its own `^~` block: nginx
    # picks the LONGEST matching `^~` prefix regardless of file order, so this
    # (more specific) block always wins over the shorter `^~ /media/` one for
    # anything under /media/live/ — but only because it exists at all.
    location ^~ /media/live/ {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The parent crumb of that same page: "/media/live" with NO trailing slash.
    # The `^~ /media/live/` prefix above does not match it, so without this it
    # falls through to `^~ /media/` (uploaded files -> API) and 404s. An exact
    # `location =` beats every prefix match, so this is unambiguous and cannot
    # shadow an uploaded filename.
    location = /media/live {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Uploaded media (images/video) — API route ────────────────────────────
    # MediaAsset.url is always "/media/<file>"; served by mediaFilesRouter in
    # the API (not the CMS). Stays on plain HTTP, unauthenticated — TV displays
    # load images/video with no session, same as /display.
    location ^~ /media/ {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── API REST routes (incl. /api/auth/* and /api/upload — all in the API) ──
    location /api/ {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST /api/upload (video uploads) lands here — see the /api/media
        # block above for why this needs more than nginx's 60s default.
        client_body_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ─── Health check (root-level alias) ─────────────────────────────────────
    location /health {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket ────────────────────────────────────────────────────────────
    # Exact /ws (no trailing slash) — the app clients (screen player + CMS) connect
    # here. Must upgrade, not 301-redirect to /ws/ (WS handshakes can't follow a
    # redirect, which silently kills all real-time sync).
    location = /ws {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws/ {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /vision/ws {
        resolver 127.0.0.11 valid=10s;
        set $vision_upstream http://vision-inference:8000;
        proxy_pass $vision_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /vision/ {
        resolver 127.0.0.11 valid=10s;
        set $vision_upstream http://vision-inference:8000;
        proxy_pass $vision_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~* ^/_next/static/ {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ─── Admin dashboard shell — force HTTPS (catch-all, must be last) ────────
    # /screens, /screens/[id], login page, etc. all land here — session-cookie
    # bearing routes, so redirect rather than serve over plain http.
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server — full route set, identical to the http server above but every
# route (including /display and /api/auth/*) is served directly, no redirects.
server {
    listen 443 ssl;
    server_name ec-cms 192.168.1.250;

    # Re-resolved per request via the http-level resolver above — see the
    # comment there for why this is a variable and not an upstream block.
    set $api_up http://api:4000;
    set $cms_up http://cms:3000;
    access_log /dev/stdout timed;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # ─── Data Art Studio videos — the API streams 4K renders from R2 ─────────
    # Unbuffered like /api/media, so a long clip streams instead of spooling
    # to nginx temp files first (see apps/api/src/routes/data-art-studio.ts).
    location ^~ /api/data-art-studio/video {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── Media (range streaming) — API route, buffering off for large video ────
    # Precedes the generic /api/ only to disable proxy buffering; same upstream.
    location ^~ /api/media {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A multi-hundred-MB video upload over anything less than a fast
        # connection can take well past nginx's 60s default, silently
        # aborting the request before the API ever writes the media_asset
        # row (upload just vanishes, nothing in the Media Library). Same
        # generous window as the /ws blocks below, for the same reason.
        client_body_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # The bare path (no filename) isn't a real asset — mediaFilesRouter only
    # matches /media/:filename, so this would otherwise fall into the ^~ /media/
    # block below and 404 from the API. Send it to the actual CMS Media
    # Library page instead. Must precede ^~ /media/ — nginx picks an exact
    # `location =` match over a prefix match regardless of file order.
    # The bare path (no filename, with or without trailing slash) isn't a real
    # asset — mediaFilesRouter only matches /media/:filename, so it would 404
    # from the API. Send both forms straight to the CMS Media Library page
    # instead. NOTE: don't try to redirect one form to the other here — nginx
    # has built-in behavior that auto-redirects a bare "/media" request to
    # "/media/" for any proxy_pass location whose prefix ends in "/" (like
    # `^~ /media/` below), so a manual `return 301 /media;` on `= /media/`
    # creates a real infinite redirect loop with that native behavior.
    location = /media/ {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /media {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Media Library's queue-push live-control page (/media/live/<screenId>)
    # — a CMS route, not an uploaded file, but it shares the /media/ prefix
    # with the uploaded-media block below. Must be its own `^~` block: nginx
    # picks the LONGEST matching `^~` prefix regardless of file order, so this
    # (more specific) block always wins over the shorter `^~ /media/` one for
    # anything under /media/live/ — but only because it exists at all.
    location ^~ /media/live/ {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The parent crumb of that same page: "/media/live" with NO trailing slash.
    # The `^~ /media/live/` prefix above does not match it, so without this it
    # falls through to `^~ /media/` (uploaded files -> API) and 404s. An exact
    # `location =` beats every prefix match, so this is unambiguous and cannot
    # shadow an uploaded filename.
    location = /media/live {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Uploaded media (images/video) — API route ────────────────────────────
    # MediaAsset.url is always "/media/<file>"; served by mediaFilesRouter in
    # the API (not the CMS).
    location ^~ /media/ {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── API REST routes (incl. /api/auth/* and /api/upload — all in the API) ──
    location /api/ {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST /api/upload (video uploads) lands here — see the /api/media
        # block above for why this needs more than nginx's 60s default.
        client_body_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ─── Health check (root-level alias) ─────────────────────────────────────
    location /health {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── WebSocket ────────────────────────────────────────────────────────────
    # Exact /ws (no trailing slash) — the app clients (screen player + CMS) connect
    # here. Must upgrade, not 301-redirect to /ws/ (WS handshakes can't follow a
    # redirect, which silently kills all real-time sync).
    location = /ws {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws/ {
        proxy_pass $api_up;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /vision/ws {
        resolver 127.0.0.11 valid=10s;
        set $vision_upstream http://vision-inference:8000;
        proxy_pass $vision_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /vision/ {
        resolver 127.0.0.11 valid=10s;
        set $vision_upstream http://vision-inference:8000;
        proxy_pass $vision_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~* ^/_next/static/ {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # NOTE: /screens, /screens/[id], and /display are CMS routes — they fall through
    # to the catch-all `location /` ($cms_up) below.

    # ─── CMS admin — catch-all (must be last) ────────────────────────────────
    location / {
        proxy_pass $cms_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never cache HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
