# Routes shared by nexus's :80 and :443 servers (../default.conf), included at
# server level. Proxy headers come from the http level of default.conf: do NOT
# add proxy_set_header to a location here, or that location loses all of them.
#
# The upstreams are variables so nginx re-resolves them per request (resolver
# in default.conf): a recreated container is picked up without an nginx restart.
set $api_up    http://api:4000;
set $cms_up    http://cms:3000;
set $vision_up http://vision-inference:8000;

access_log /dev/stdout timed;

# ─── Drava Mosaic videos — the API streams 4K renders from R2 ─────────────
# Unbuffered like /api/media, so a long clip streams instead of spooling to
# nginx temp files first (apps/api/src/routes/drava-mosaic.ts).
location ^~ /api/drava-mosaic/video {
    proxy_pass $api_up;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

# ─── Media (range streaming + uploads) — API, buffering off for large video ──
# A multi-hundred-MB upload can take well past nginx's 60 s default, which
# silently aborts it before the API writes the media_asset row.
location ^~ /api/media {
    proxy_pass $api_up;
    proxy_buffering off;
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

# ─── /media/* — uploaded files (API), except CMS pages that share the prefix ─
# MediaAsset.url is always "/media/<file>", served by the API's mediaFilesRouter
# (uploads, then the seed assets in apps/cms/public/media). Unauthenticated:
# TV displays load images/video with no session.
#
# GOTCHA: any NEW CMS page under /media/ 404s from the API until it gets its own
# block here. Exact `=` matches beat every prefix, and the longest `^~` prefix
# wins regardless of order. Don't redirect /media <-> /media/ by hand: nginx
# already auto-redirects "/media" for a proxy_pass prefix ending in "/", and a
# manual 301 back creates a real redirect loop.
location = /media {                 # Media Library page
    proxy_pass $cms_up;
}

location = /media/ {                # Media Library page (trailing slash)
    proxy_pass $cms_up;
}

location = /media/live {            # breadcrumb parent of the live-control page
    proxy_pass $cms_up;
}

location ^~ /media/live/ {          # queue-push live control, /media/live/<screenId>
    proxy_pass $cms_up;
}

location ^~ /media/ {               # the uploaded files themselves
    proxy_pass $api_up;
    proxy_buffering off;
}

# ─── API REST routes (incl. /api/auth/* and /api/upload) ─────────────────────
location /api/ {
    proxy_pass $api_up;
    # POST /api/upload (video uploads) lands here: same long window as /api/media.
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

# ─── Health check (root-level alias) ─────────────────────────────────────────
location /health {
    proxy_pass $api_up;
}

# ─── WebSocket gateway ───────────────────────────────────────────────────────
# Exact /ws (no trailing slash) is what the screen player and CMS connect to. It
# must upgrade, not 301 to /ws/: a WS handshake can't follow a redirect, which
# silently kills all real-time sync. /ws/ is what the publisher EXE uses.
location = /ws {
    proxy_pass $api_up;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /ws/ {
    proxy_pass $api_up;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ─── Vision inference (services/vision; 502 while it isn't running) ──────────
location = /vision/ws {
    proxy_pass $vision_up;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /vision/ {
    proxy_pass $vision_up;
}

# ─── Next.js build output: content-hashed, safe to cache forever ─────────────
location ~* ^/_next/static/ {
    proxy_pass $cms_up;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
