events {
    worker_connections 1024;
}

http {
    # Allow large media uploads to pass through to the API (matches prod default.conf).
    client_max_body_size 500M;

    # host.docker.internal resolves to the Windows host from inside Docker Desktop.
    # Node apps (API :4000, CMS :3000) run on Windows — not in Docker. The CMS
    # serves both the dashboard and the /display player (single origin).

    upstream cms_upstream {
        server host.docker.internal:3000;
    }

    upstream api_upstream {
        server host.docker.internal:4000;
    }

    server {
        listen 80;
        server_name localhost;

        # API REST routes (incl. /api/auth/* — Better Auth now lives in the API).
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health alias at root level (no /api/ prefix)
        location /health {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket upgrade (matches both /ws and /ws/… so the client's exact
        # path never falls through to the CMS catch-all).
        location /ws {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The bare path (no filename, with or without trailing slash) isn't a
        # real asset — mediaFilesRouter only matches /media/:filename, so it
        # would 404 from the API. Send both forms straight to the CMS Media
        # Library page instead. NOTE: don't try to redirect one form to the
        # other here — nginx has built-in behavior that auto-redirects a bare
        # "/media" request to "/media/" for any proxy_pass location whose
        # prefix ends in "/" (like `/media/` below), so a manual `return 301
        # /media;` on `= /media/` creates a real infinite redirect loop with
        # that native behavior.
        location = /media/ {
            proxy_pass http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /media {
            proxy_pass http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The Media Library's queue-push live-control page (/media/live/<screenId>)
        # — a CMS route, not an uploaded file, but it shares the /media/ prefix
        # with the uploaded-media block below. Must precede it with `^~` so the
        # longer, more specific prefix wins for anything under /media/live/.
        location ^~ /media/live/ {
            proxy_pass http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # The parent crumb of that same page: "/media/live" with NO trailing slash.
        # The `^~ /media/live/` prefix above does not match it, so without this it
        # falls through to `^~ /media/` (uploaded files -> API) and 404s. An exact
        # `location =` beats every prefix match, so this is unambiguous and cannot
        # shadow an uploaded filename.
        location = /media/live {
            proxy_pass http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Uploaded media (images/video) — served by the API at /media/:filename,
        # not the CMS. MediaAsset.url is always "/media/<file>".
        location /media/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Display player is served by the CMS at /display (same origin as the CMS).
        location /display {
            proxy_pass http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # CMS — catch-all (must be last)
        location / {
            proxy_pass http://cms_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Future SSL/domain: replace server_name with your domain and add:
        #   listen 443 ssl;
        #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
        #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
        #   return 301 https://$host$request_uri; (in a separate port 80 block)
    }
}
